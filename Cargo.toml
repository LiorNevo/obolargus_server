[package]
name = "obolargus-server"
version = "0.1.0"
description = "Axum REST API backend for Obolargus"
edition.workspace = true
rust-version.workspace = true

[dependencies]
obolargus-core = { path = "../obolargus_core", features = ["openapi"] }
lx_engine = { path = "../lx_engine" }
axum = "0.8.9"
tokio.workspace = true
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros"] }
jsonwebtoken = "11.1.0"
argon2 = "0.6.0"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.2.1+spec-1.1.0"
envconfig = "0.11.1"
dotenvy = "0.15.7"
yahoo_finance_api = { version = "5.0.0", features = ["governor", "decimal"] }
thiserror = "2.0.21"
chrono.workspace = true
futures = "0.3.34"
uuid = { version = "1.29.1", features = ["v4", "serde"] }
time = "0.3.55"
async-trait = "0.1.92"
rust_decimal.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true
cron = "0.17.0"
chrono-tz = "0.10.4"
tokio-util = "0.7.20"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
wiremock = "0.6.5"
flate2 = "1.1.11"
oas3 = "0.22.0"
