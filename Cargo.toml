[package]
name = "obolargus-server"
version = "0.1.0"
description = "Axum REST API backend for Obolargus"
edition.workspace = true
rust-version.workspace = true

[dependencies]
obolargus-core = { path = "../obolargus_core" }
lx_engine = { path = "../lx_engine" }
axum = "0.8.9"
tokio.workspace = true
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros"] }
jsonwebtoken = "11.0.0"
argon2 = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
clap = { version = "4.6.6", features = ["derive"] }
toml = "1.1.4+spec-1.1.0"
envconfig = "0.11.1"
dotenvy = "0.15.7"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
